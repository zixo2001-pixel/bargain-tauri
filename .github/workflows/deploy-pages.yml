name: Deploy Bargain Rules UI to GitHub Pages

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'data/monitor-state.json'
      - '.github/workflows/monitor.yml'
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build Static Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Copy live monitor-state.json to public assets before build
        run: |
          mkdir -p public/data
          if [ -f data/monitor-state.json ]; then
            cp data/monitor-state.json public/data/monitor-state.json
          fi

      - name: Build Vite static frontend
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npx vite build --base="${{ steps.pages.outputs.base_path }}/"

      - name: Create 404.html for SPA GitHub Pages fallback
        run: cp dist/index.html dist/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
